[project]
name = "pyautark-tutorial"
version = "0.1.0"
description = "Urban data analytics with pyautark: Jupyter notebooks modeled after the Autark tutorial"
requires-python = ">=3.10"
dependencies = [
    "autark[widget]",
    "jupyterlab",
    "ipykernel",
    "pandas",
    "shapely",
]

[dependency-groups]
dev = ["nbclient", "nbformat", "playwright", "pillow"]

[tool.uv]
package = false

[tool.uv.sources]
autark = { path = "../pyautark/python", editable = true }
